<title>LA BLACK SQUAD— Cricket Player Auction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch:#0B3D2E;
    --pitch-deep:#082C21;
    --cream:#F3ECD8;
    --gold:#D9A441;
    --gold-bright:#F0C05A;
    --stamp-red:#B4382C;
    --action-green:#4CAF6D;
    --action-green-bright:#63C986;
    --navy:#16233A;
    --line: rgba(243,236,216,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at top, #124a37 0%, var(--pitch) 45%, var(--pitch-deep) 100%);
    color:var(--cream);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .display{font-family:'Anton',sans-serif; letter-spacing:0.02em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .container{max-width:1100px;margin:0 auto;padding:20px 16px 60px;}
  .card{
    background:rgba(8,25,18,0.72);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    border:1px solid rgba(217,164,65,0.25);
    border-radius:14px;
    padding:20px;
    box-shadow:0 8px 30px rgba(0,0,0,0.35);
  }
  .btn{
    font-family:'Inter',sans-serif;
    font-weight:700;
    border:none;
    border-radius:10px;
    padding:12px 18px;
    cursor:pointer;
    transition:transform .12s ease, filter .12s ease;
    font-size:14px;
  }
  .btn:active{transform:scale(0.96);}
  .btn:disabled{opacity:0.35;cursor:not-allowed;transform:none;}
  .btn-gold{background:linear-gradient(180deg,var(--gold-bright),var(--gold)); color:#2b1b02; box-shadow:0 4px 14px rgba(217,164,65,0.35);}
  .btn-gold:hover:not(:disabled){filter:brightness(1.08);}
  .btn-green{background:linear-gradient(180deg,var(--action-green-bright),var(--action-green)); color:#0a2412; box-shadow:0 4px 14px rgba(76,175,109,0.35);}
  .btn-green:hover:not(:disabled){filter:brightness(1.08);}
  .btn-outline{background:transparent;border:1.5px solid var(--line); color:var(--cream);}
  .btn-outline:hover:not(:disabled){border-color:var(--gold);}
  .btn-danger{background:var(--stamp-red);color:#fff;}
  .btn-navy{background:var(--navy);color:var(--cream); border:1px solid var(--line);}
  input,select{
    background:rgba(0,0,0,0.25);
    border:1px solid var(--line);
    color:var(--cream);
    border-radius:8px;
    padding:10px 12px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    width:100%;
  }
  input::placeholder{color:rgba(243,236,216,0.4);}
  label{font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:rgba(243,236,216,0.55);display:block;margin-bottom:6px;}
  .pill{
    display:inline-flex;align-items:center;gap:6px;
    padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;
    text-transform:uppercase;letter-spacing:0.05em;
  }
  .scanlines{
    position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(180deg, rgba(0,0,0,0.06) 0px, rgba(0,0,0,0.06) 1px, transparent 1px, transparent 3px);
    border-radius:14px;
  }
  .stamp{
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%) rotate(-14deg) scale(0);
    font-family:'Anton',sans-serif;
    font-size:clamp(40px,10vw,90px);
    color:var(--stamp-red);
    border:6px solid var(--stamp-red);
    padding:4px 22px;
    border-radius:10px;
    opacity:0;
    animation:stampIn .5s cubic-bezier(.2,1.4,.4,1) forwards;
    pointer-events:none;
    text-shadow:0 0 12px rgba(180,56,44,0.5);
  }
  @keyframes stampIn{
    0%{transform:translate(-50%,-50%) rotate(-14deg) scale(2.4); opacity:0;}
    60%{opacity:1;}
    100%{transform:translate(-50%,-50%) rotate(-10deg) scale(1); opacity:1;}
  }
  .ticker-track{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;}
  .ticker-track::-webkit-scrollbar{height:6px;}
  .ticker-track::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
  .team-chip{
    min-width:150px;
    background:rgba(0,0,0,0.22);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    flex-shrink:0;
  }
  .role-BAT{color:#8FD1A8;} .role-BOWL{color:#F0C05A;} .role-AR{color:#7FB8E0;} .role-WK{color:#E08FB0;}
  .tab{padding:10px 16px;border-radius:10px 10px 0 0;cursor:pointer;font-weight:700;font-size:13px;color:rgba(243,236,216,0.5);}
  .tab.active{background:rgba(255,255,255,0.05);color:var(--gold-bright);border:1px solid var(--line);border-bottom:none;}
  a.link{color:var(--gold-bright);text-decoration:underline;cursor:pointer;}
  ::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
</style>
</head>

async function loadAll(){
  // one-time initial fetch, used only for the seeding check below
  try{
    const snap = await db.ref('teams').once('value');
    teams = normalizeTeams(snap.exists() ? snap.val() : []);

  if(!seededDefaults && teams.length === 0){

}

function toObjById(arr){ const o={}; arr.forEach(x=>{ o[x.id]=x; }); return o; }
// Firebase's write APIs silently reject an ENTIRE set()/update() call if any
// nested value is JavaScript `undefined` (as opposed to `null`, which is fine
// and just means "delete this key"). Since Firebase also strips `null`/empty
// values on read, round-tripped data can end up with missing keys that later
// get reassigned as `undefined` — silently breaking the next save. Always run
// outgoing data through this before writing.
function sanitizeForFirebase(value){
  if(value === undefined) return null;
  if(Array.isArray(value)) return value.map(sanitizeForFirebase);
  if(value !== null && typeof value === 'object'){
    const out = {};
    Object.keys(value).forEach(k => { out[k] = sanitizeForFirebase(value[k]); });
    return out;
  }
  return value;
}
async function saveTeams(){ await db.ref('teams').set(sanitizeForFirebase(toObjById(teams))); }
async function savePlayers(){ await db.ref('players').set(sanitizeForFirebase(toObjById(players))); }
// Targeted single-record writes — touch only one player/team node instead of
// overwriting the whole list, so a slow/overlapping save from one action
// (e.g. Excel import) can never clobber an in-flight sold/unsold/undo write.
async function writePlayer(id, changes){ await db.ref('players/'+id).update(sanitizeForFirebase(changes)); }
async function writeTeam(id, changes){ await db.ref('teams/'+id).update(sanitizeForFirebase(changes)); }

// Admin: mark an already-sold player as unsold. Resets the player to its base
// price (back to the pending pool status 'unsold') and returns the sale amount
// back to the buying team (reduces their spend, removes them from the roster).
async function markSoldAsUnsold(playerId){
  const playerSnap = await db.ref('players/'+playerId).once('value');
  const teamSnap = await db.ref('teams').once('value');
  const p = playerSnap.exists() ? playerSnap.val() : null;
  const allTeams = normalizeTeams(teamSnap.exists() ? teamSnap.val() : []);
  if(!p) throw new Error('Player not found.');
  if(p.status !== 'sold' || !p.soldTo) throw new Error('This player is not currently sold.');

  const teamId = p.soldTo;
  const price = p.soldPrice || p.base || 0;
  const t = allTeams.find(x=>x.id===teamId);
  if(!t) throw new Error('Buying team not found.');

  // Revert the player to unsold (keeps them out of future draws unless re-queued)
  await writePlayer(playerId, { status:'unsold', soldTo:null, soldPrice:null });

  // Return the money and remove the player from the team roster
  const newRoster = (Array.isArray(t.roster) ? t.roster : (t.roster ? Object.values(t.roster) : []))
    .filter(r => r.playerId !== playerId);
  const newSpent = Math.max(0, (t.spent||0) - price);
  await writeTeam(teamId, { spent: newSpent, roster: newRoster });

  // Sync local mirrors
  const localP = players.find(x=>x.id===playerId); if(localP){ localP.status='unsold'; delete localP.soldTo; delete localP.soldPrice; }
  const localT = teams.find(x=>x.id===teamId); if(localT){ localT.spent = newSpent; localT.roster = newRoster; }

  // Log the action
  auction.log = auction.log || [];
  auction.log.unshift({ type:'sold_revoked', player:p.name, team:t.name, amount:price, ts:Date.now() });
  await saveAuction();

  return { player:p.name, team:t.name, price };
}

// Admin: allocate an unsold player to a team at a given price. Marks the player
// sold to that team, adds the price to the team's spend, and includes them in
// the team roster. Falls back to the player's base price if no price is given.
async function allocateUnsold(playerId, teamId, price){
  const playerSnap = await db.ref('players/'+playerId).once('value');
  const teamSnap = await db.ref('teams/'+teamId).once('value');
  const p = playerSnap.exists() ? playerSnap.val() : null;
  const t = teamSnap.exists() ? teamSnap.val() : null;
  if(!p) throw new Error('Player not found.');
  if(!t) throw new Error('Team not found.');
  if(p.status !== 'unsold') throw new Error('Only unsold players can be allocated.');

  const finalPrice = (price !== undefined && price !== null && !isNaN(price) && price > 0)
    ? price : (p.base || 0);
  const prevRoster = Array.isArray(t.roster) ? [...t.roster] : (t.roster ? Object.values(t.roster) : []);

  await writePlayer(playerId, { status:'sold', soldTo:teamId, soldPrice:finalPrice });
  const newRoster = [...prevRoster, { playerId, price: finalPrice }];
  await writeTeam(teamId, { spent: (t.spent||0) + finalPrice, roster: newRoster });

  const localP = players.find(x=>x.id===playerId); if(localP){ localP.status='sold'; localP.soldTo=teamId; localP.soldPrice=finalPrice; }
  const localT = teams.find(x=>x.id===teamId); if(localT){ localT.spent = (t.spent||0) + finalPrice; localT.roster = newRoster; }

  auction.log = auction.log || [];
  auction.log.unshift({ type:'allocated', player:p.name, team:t.name, amount:finalPrice, ts:Date.now() });
  await saveAuction();

  return { player:p.name, team:t.name, price: finalPrice };
}

// PIN-gated confirmation for destructive actions (deleting a player/team, or a
// full reset). First use sets the PIN; every use after must match it.
async function confirmDeletePin(actionLabel){
  try{
    const snap = await db.ref('settings/deletePin').once('value');
    const existing = snap.exists() ? snap.val() : null;
    if(!existing){
      const setPin = prompt(`Set a PIN to protect deletions (you'll need it every time you ${actionLabel}):`);
      if(!setPin || !setPin.trim()) return false;
      await db.ref('settings/deletePin').set(setPin.trim());
      return true;
    }
    const entered = prompt(`Enter the delete PIN to ${actionLabel}:`);
    if(entered === null) return false;
    if(entered.trim() !== existing){ alert('Incorrect PIN.'); return false; }
    return true;
  }catch(e){
    alert('Could not verify PIN — check your connection and try again.');
    return false;
  }
}
async function saveAuction(){ await db.ref('auctionState').set(sanitizeForFirebase(auction)); }

function attachRealtimeListeners(){
  db.ref('teams').on('value', (snap)=>{
    teams = normalizeTeams(snap.exists() ? snap.val() : []);
    if(screen === 'login'){
      if(!loginRenderedOnce){ loginRenderedOnce = true; render(); }
      return;
    }
    if(activeTab === 'setup') return; // don't clobber the form the admin is filling in
    render();
  });
  db.ref('players').on('value', (snap)=>{
    players = toArray(snap.exists() ? snap.val() : []);
    if(screen === 'app' && activeTab !== 'setup') render();
  });
  let lastNotifiedBidTs = null;
  db.ref('auctionState').on('value', (snap)=>{
    if(snap.exists()) auction = snap.val();
    if(auction.stampFlash){
      const age = Date.now() - auction.stampFlash.ts;
      if(age < 5000){
        setTimeout(()=>{ if(screen === 'app' && activeTab !== 'setup') render(); }, 5000 - age + 50);
      }
    }
    // Render FIRST, unconditionally, so every live bid update reaches the
    // screen no matter what. Anything below this line is a nice-to-have
    // side effect (the reserve banner) and must never be able to block it.
    if(screen === 'app' && activeTab !== 'setup') render();

    // New-bid reserve check — only relevant for team owners, only once their
    // spend has crossed the configured threshold, and only if a minimum
    // squad size is actually configured. Wrapped defensively so a bug here
    // can never again interfere with the live bidding feed above.
    try{
      const latestEntry = (auction.log||[])[0];
      if(latestEntry && latestEntry.type==='bid' && latestEntry.ts !== lastNotifiedBidTs){
        lastNotifiedBidTs = latestEntry.ts;
        if(reserveWarnEnabled && me.role==='owner' && squadMinRequired){
          const myTeam = teams.find(t=>t.id===me.teamId);
          if(myTeam && myTeam.spent >= reserveWarnThreshold){
            const boughtCount = (myTeam.roster||[]).length;
            const slotsNeeded = Math.max(0, squadMinRequired - boughtCount);
            const purseRemaining = myTeam.purse - myTeam.spent;
            const maxBid = maxAllowedBid(myTeam);
            if(slotsNeeded > 0){
              showReserveBanner(`Reserve check: ${purseRemaining.toFixed(2)} Cr left, ${slotsNeeded} player(s) still needed — you can safely bid up to ₹${maxBid.toFixed(2)} Cr right now.`);
            }
          }
        }
      }
    }catch(e){ console.error('Reserve banner check failed (non-fatal):', e); }
  });
  db.ref('auditLog').on('value', (snap)=>{
    auditEntries = snap.exists() ? Object.values(snap.val()) : [];
    if(screen === 'app' && activeTab === 'audit') render();
  });
  db.ref('settings/timerDuration').on('value', (snap)=>{
    if(snap.exists() && typeof snap.val() === 'number') timerDuration = snap.val();
  });
  db.ref('settings/timerEnabled').on('value', (snap)=>{
    timerEnabled = snap.exists() ? !!snap.val() : false;
    if(screen === 'app' && activeTab !== 'setup') render();
  });
  db.ref('settings/squadCap').on('value', (snap)=>{
    squadCap = (snap.exists() && typeof snap.val() === 'number' && snap.val() > 0) ? snap.val() : null;
    if(screen === 'app' && activeTab !== 'setup') render();
  });
  db.ref('settings/squadMinRequired').on('value', (snap)=>{
    squadMinRequired = (snap.exists() && typeof snap.val() === 'number' && snap.val() > 0) ? snap.val() : null;
    if(screen === 'app' && activeTab !== 'setup') render();
  });

// Local per-second countdown for the live bidding timer. Runs off the shared
// auction.bidDeadline timestamp so every device shows the same countdown
// without needing its own network round-trip each second.
let timerTickHandle = null;
let cooldownWasActive = false;
function startTimerTicker(){
  if(timerTickHandle) clearInterval(timerTickHandle);
  timerTickHandle = setInterval(()=>{
    const timerEl = document.getElementById('bidTimerDisplay');
    if(timerEl){
      if(auction.status !== 'bidding' || !auction.bidDeadline){ timerEl.textContent = ''; }
      else {
        const remaining = Math.max(0, Math.ceil((auction.bidDeadline - Date.now())/1000));
        timerEl.textContent = remaining;
        timerEl.style.color = remaining <= 3 ? 'var(--stamp-red)' : 'var(--gold-bright)';
      }
    }

    const cooldownEl = document.getElementById('bidCooldownDisplay');
    const cooldownActive = bidCooldownEnabled && auction.bidCooldownUntil && Date.now() < auction.bidCooldownUntil;
    if(cooldownEl){
      if(cooldownActive){
        const remaining = Math.max(0, Math.ceil((auction.bidCooldownUntil - Date.now())/1000));
        cooldownEl.textContent = `Bidding reopens in ${remaining}s…`;
      } else {
        cooldownEl.textContent = '';
      }
    }
    // The moment cooldown expires, force one re-render so the Bid button
    // (which was disabled) becomes clickable again without waiting for
    // some unrelated event to refresh the screen.
    if(cooldownWasActive && !cooldownActive){
      if(screen === 'app' && activeTab !== 'setup') render();
    }
    cooldownWasActive = cooldownActive;

    // Mark Unsold has a configurable grace period after a player is drawn —
    // update its visible countdown, and force one re-render the moment it
    // elapses so the button flips to enabled without waiting for anything else.
    const graceBtn = document.getElementById('unsoldBtnGrace');
    const graceDisplay = document.getElementById('unsoldGraceDisplay');
    if(graceDisplay){
      if(auction.roundStartTs && unsoldGraceDuration > 0 && auction.status==='bidding' && !auction.currentBid){
        const remaining = Math.max(0, Math.ceil((unsoldGraceDuration*1000 - (Date.now() - auction.roundStartTs))/1000));
        graceDisplay.textContent = remaining > 0 ? `${remaining}s` : 'Ready';
      } else if(unsoldGraceDuration <= 0){
        graceDisplay.textContent = 'Off';
      } else {
        graceDisplay.textContent = 'Ready';
      }
    }
    if(graceBtn && auction.roundStartTs && (Date.now() - auction.roundStartTs) >= (unsoldGraceDuration*1000)){
      if(screen === 'app' && activeTab !== 'setup') render();
    }
  }, 250);
}

// ---------- bid increment logic (IPL-style tiers, in ₹ Cr) ----------
// Returns the next clean bid amount (not a delta) — snaps up to the next
// round multiple of the current bracket's step, strictly greater than the
// current bid. Brackets align exactly with step multiples (0.5, 2, 5 are
// all clean multiples of their bracket's step), so boundaries are handled
// automatically with no special-casing needed. Uses integer "cents of a
// crore" math throughout to avoid JS floating point drift (0.1+0.2 issues).
function nextCleanBid(current){
  let step;
  if(current < 0.5) step = 0.1;
  else if(current < 2) step = 0.25;
  else if(current < 5) step = 0.5;
  else step = 1;
  const currentUnits = Math.round(current * 100);
  const stepUnits = Math.round(step * 100);
  const nextUnits = (Math.floor(currentUnits / stepUnits) + 1) * stepUnits;
  return nextUnits / 100;
}
function fmtCr(n){ return '₹' + (Math.round(n*100)/100).toFixed(2) + ' Cr'; }

function pickRandom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

// ---------- squad-completion reserve (IPL-style "purse protection") ----------
// Guarantees a team can never bid away money it will need to reach the
// minimum required squad size. Reserve-per-slot is the LOWEST base price
// still in the pending pool, so every remaining required slot is always
// affordable no matter which players get bought by others first.
// Reserve needed to guarantee a team can still fill `slotsNeeded` more required
// slots after this bid, in the worst case where only the priciest remaining
// players are left by the time they get to them. This is the SUM of the
// top-N most expensive base prices still pending — NOT the single highest
// price multiplied by N, which would over-reserve (e.g. needing 3 more slots
// with pending base prices of 5, 3, 2, 1 Cr should reserve 5+3+2=10 Cr, not
// 5×3=15 Cr — only one player can ever cost the top price).
function reserveNeededForSlots(slotsNeeded){
  if(slotsNeeded <= 0) return 0;
  const pendingBases = players.filter(p=>p.status==='pending').map(p=>p.base).sort((a,b)=>b-a);
  return pendingBases.slice(0, slotsNeeded).reduce((sum,v)=>sum+v, 0);
}
function maxAllowedBid(team){
  if(!squadMinRequired || !team) return Infinity;
  const boughtCount = (team.roster||[]).length;
  const slotsNeeded = Math.max(0, squadMinRequired - boughtCount);
  if(slotsNeeded <= 0) return Infinity; // already met the minimum — no more restriction
  const slotsAfterThisBid = slotsNeeded - 1;
  const reserveNeeded = reserveNeededForSlots(slotsAfterThisBid);
  const purseRemaining = team.purse - team.spent;
  return Math.max(0, purseRemaining - reserveNeeded);
}

// ---------- id helper ----------
function uid(){ return Math.random().toString(36).slice(2,9); }
// Firebase Realtime Database can return array-like data as a plain object
// (e.g. after certain deletes/concurrent writes create non-sequential keys).
// Always normalize to a real array so .forEach/.find/.map never blow up.
function toArray(val){
  if(!val) return [];
  if(Array.isArray(val)) return val;
  if(typeof val === 'object') return Object.values(val);
  return [];
}
// Firebase RTDB silently drops keys whose value is an empty array/object
// (e.g. a fresh team's roster:[] vanishes on the next read). Always repair
// team records with sane defaults so downstream code never sees `undefined`.
function normalizeTeams(val){
  return toArray(val).map(t => ({
    ...t,
    purse: (typeof t.purse === 'number') ? t.purse : (parseFloat(t.purse) || 0),
    spent: (typeof t.spent === 'number') ? t.spent : (parseFloat(t.spent) || 0),
    roster: Array.isArray(t.roster) ? t.roster : (t.roster ? Object.values(t.roster) : [])
  }));
}

  const tabs = el('div',''); tabs.style.display='flex'; tabs.style.gap='6px'; tabs.style.marginBottom='0'; tabs.style.flexWrap='wrap';
  const tabDefs = [['live','Live Auction']];
  if(me.role==='admin') tabDefs.push(['setup','Setup']);
  tabDefs.push(['teams', me.role==='owner' ? 'My Squad' : 'Teams & Squads']);
  const showPoolTab = me.role==='admin' || (me.role==='owner' && poolTabVisibleToOwner) || (me.role==='spectator' && poolTabVisibleToSpectator);
  if(showPoolTab) tabDefs.push(['pool','Pending Players']);
  if(me.role==='admin') tabDefs.push(['activity','Activity']);
  if(me.role==='admin') tabDefs.push(['audit','Audit Log']);
  tabDefs.forEach(([key,label])=>{
    const t = el('div', 'tab'+(activeTab===key?' active':''), label);
    t.onclick = ()=>{ activeTab = key; render(); };
    tabs.appendChild(t);
  });
  root.appendChild(tabs);

  const panel = el('div','card'); panel.style.borderRadius='0 10px 10px 10px';
  if(activeTab==='pool' && !showPoolTab) activeTab = 'live';
  const isAdmin = me.role==='admin';
  if(!isAdmin && (activeTab==='setup' || activeTab==='audit' || activeTab==='activity')) activeTab = 'live';
  if(activeTab==='live') renderLive(panel);
  else if(activeTab==='setup') renderSetup(panel);
  else if(activeTab==='audit') renderAuditPanel(panel);
  else if(activeTab==='activity') renderActivityPanel(panel);
  else if(activeTab==='pool') renderPoolPanel(panel);
  else renderTeamsPanel(panel);
  root.appendChild(panel);
}

// ---------- ACTIVITY TAB (everyone) ----------
function renderActivityPanel(panel){
  panel.appendChild(el('div','display',`<span style="font-size:20px;color:var(--gold-bright);">Activity</span>`));
  panel.appendChild(el('div','','<div style="font-size:12px;color:rgba(243,236,216,0.5);margin:6px 0 14px;">Every bid, sale, and decision from the auction floor.</div>'));
  const list = el('div','');
  const entries = (auction.log||[]);
  if(!entries.length){
    list.appendChild(el('div','','<div style="color:rgba(243,236,216,0.4);font-size:13px;">Nothing yet — the action will show up here once bidding starts.</div>'));
  }
  entries.slice(0,60).forEach(entry=>{
    const line = el('div','mono'); line.style.fontSize='13px'; line.style.padding='8px 0'; line.style.borderBottom='1px solid var(--line)'; line.style.color='rgba(243,236,216,0.8)';
    if(entry.type==='bid') line.innerHTML = `+ ${entry.team} bids ${fmtCr(entry.amount)}`;
    else if(entry.type==='sold') line.innerHTML = `🔨 ${entry.player} → ${entry.team} for ${fmtCr(entry.amount)}`;
    else if(entry.type==='unsold') line.innerHTML = `— ${entry.player} unsold`;
    else if(entry.type==='start') line.innerHTML = `▶ ${entry.player} on the block`;
    else if(entry.type==='pass') line.innerHTML = `🚫 ${entry.team} passed`;
    else if(entry.type==='wait') line.innerHTML = `⏳ ${entry.team} called Hold`;
    else if(entry.type==='undo_bid') line.innerHTML = `↺ Last bid undone`;
    else if(entry.type==='sold_revoked') line.innerHTML = `↺ ${entry.player} marked unsold — ${fmtCr(entry.amount)} returned to ${entry.team}`;
    else if(entry.type==='allocated') line.innerHTML = `► ${entry.player} allocated to ${entry.team} for ${fmtCr(entry.amount)}`;
    else line.innerHTML = JSON.stringify(entry);
    list.appendChild(line);
  });
  panel.appendChild(list);
}

  const pending = players.filter(p=>p.status==='pending');

    const b = el('button', 'btn '+(poolRoleFilter===key?'btn-gold':'btn-outline'), `${label} (${count})`);

    listWrap.appendChild(el('div','','<div style="color:rgba(243,236,216,0.4);font-size:13px;">No pending players in this category.</div>'));

      const row = el('div',''); row.style.padding='10px 0'; row.style.borderBottom='1px solid var(--line)';

      top.innerHTML = `<span><span class="${ROLE_COLORS[p.role]}" style="font-weight:700;">${ROLE_LABELS[p.role]}</span> · ${p.name}</span><span class="mono" style="color:var(--gold-bright);">${fmtCr(p.base)}</span>`;

  npSelect.onchange = async ()=>{

// ---------- LIVE AUCTION TAB ----------
function renderLive(panel){
  const currentPlayer = players.find(p=>p.id===auction.currentPlayerId);

  // team ticker
  const ticker = el('div',''); ticker.style.marginBottom='18px';
  const track = el('div','ticker-track');
  teams.forEach(t=>{
    const chip = el('div','team-chip');
    const isLeading = t.id === auction.leadingTeamId && auction.status==='bidding';
    const hasPassed = auction.status==='bidding' && (auction.passed||[]).includes(t.id);
    const hasHeld = auction.status==='bidding' && (auction.waitUsed||[]).includes(t.id);
    let highlight = null;
    if(isLeading) highlight = 'var(--action-green-bright)';
    else if(hasPassed) highlight = 'var(--stamp-red)';
    else if(hasHeld) highlight = 'var(--gold-bright)';
    chip.style.borderColor = highlight || 'var(--line)';
    if(highlight) chip.style.boxShadow = `0 0 0 1px ${highlight}`;
    chip.innerHTML = `
      <div style="font-weight:700;font-size:13px;${t.id===me.teamId?'color:var(--gold-bright)':''}">${t.name}${t.id===me.teamId?' (you)':''}</div>
      <div class="mono" style="font-size:15px;margin-top:4px;">${fmtCr(t.purse - t.spent)}</div>
      <div style="font-size:10px;color:rgba(243,236,216,0.5);margin-top:2px;">purse left · ${(t.roster||[]).length}${squadCap?'/'+squadCap:''} bought</div>
    `;
    track.appendChild(chip);
  });

  // Unsold-grace countdown chip — sits at the end of the ticker row
  const roundAgeForChip = auction.roundStartTs ? (Date.now() - auction.roundStartTs) : 999999;
  const graceActiveForChip = unsoldGraceDuration > 0 && auction.status==='bidding' && !auction.currentBid && roundAgeForChip < (unsoldGraceDuration*1000);
  const graceChip = el('div','team-chip'); graceChip.id='unsoldGraceChip';
  graceChip.style.marginLeft='auto';
  graceChip.style.display='flex'; graceChip.style.flexDirection='column'; graceChip.style.justifyContent='center'; graceChip.style.alignItems='center'; graceChip.style.textAlign='center';
  graceChip.innerHTML = `
    <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:rgba(243,236,216,0.5);">Unsold Timer</div>
    <div id="unsoldGraceDisplay" class="mono" style="font-size:20px;color:var(--gold-bright);margin-top:4px;">${graceActiveForChip ? Math.max(0, Math.ceil((unsoldGraceDuration*1000 - roundAgeForChip)/1000)) + 's' : (unsoldGraceDuration>0 ? 'Ready' : 'Off')}</div>
  `;
  track.appendChild(graceChip);
  ticker.appendChild(track);
  panel.appendChild(ticker);

  // current player card
  const stage = el('div',''); stage.style.position='relative';
  stage.style.background='linear-gradient(180deg, rgba(0,0,0,0.28), rgba(0,0,0,0.12))';
  stage.style.border='1px solid var(--line)'; stage.style.borderRadius='14px'; stage.style.padding='28px'; stage.style.textAlign='center'; stage.style.overflow='hidden';

  const flash = auction.stampFlash;
  const showStamp = flash && (Date.now() - flash.ts < 5000);

  if(!currentPlayer){
    if(showStamp){
      stage.style.minHeight = '260px';
      stage.style.display = 'flex';
      stage.style.flexDirection = 'column';
      stage.style.justifyContent = 'flex-end';
      stage.innerHTML = `
        <div class="scanlines"></div>
        <div style="flex:1;"></div>
        <div class="display" style="font-size:clamp(24px,5vw,40px);">${flash.player}</div>
        ${flash.type==='SOLD' ? `<div style="margin-top:12px;font-size:18px;font-weight:700;color:var(--gold-bright);">Sold to ${flash.team}</div><div class="mono" style="margin-top:4px;color:rgba(243,236,216,0.7);">${fmtCr(flash.amount)}</div>` : `<div class="mono" style="margin-top:8px;color:rgba(243,236,216,0.5);">Went unsold</div>`}
      `;
      const stampEl = el('div','stamp', flash.type);
      stampEl.style.top = '32%';
      stage.appendChild(stampEl);
    } else {
      stage.appendChild(el('div','', `<div style="color:rgba(243,236,216,0.5);font-size:14px;">${auction.status==='idle' ? 'No player on the block. Waiting for the auctioneer to start.' : 'Round complete.'}</div>`));
    }
  } else {
    const roleColor = ROLE_COLORS[currentPlayer.role] || '';
    stage.innerHTML = `
      <div class="scanlines"></div>
      <div class="pill ${roleColor}" style="border:1px solid currentColor;margin-bottom:10px;">${ROLE_LABELS[currentPlayer.role]}</div>
      <div class="display" style="font-size:clamp(28px,6vw,48px);">${currentPlayer.name}</div>
      <div class="mono" style="font-size:12px;color:rgba(243,236,216,0.5);margin-top:4px;">Base Price ${fmtCr(currentPlayer.base)}</div>
      ${statsStripHTML(currentPlayer)}
      ${auction.commentary ? `<div style="margin-top:14px;font-size:13px;font-style:italic;color:var(--cream);opacity:0.85;max-width:520px;margin-left:auto;margin-right:auto;line-height:1.5;">"${auction.commentary}"</div>` : ''}
      <div style="margin-top:22px;">
        <div style="font-size:11px;letter-spacing:0.15em;text-transform:uppercase;color:rgba(243,236,216,0.5);">Current Bid</div>
        <div class="display" style="font-size:clamp(44px,10vw,72px);color:var(--gold-bright);line-height:1;">${fmtCr(auction.currentBid || currentPlayer.base)}</div>
        <div style="font-size:13px;margin-top:6px;color:${auction.leadingTeamId?'var(--gold-bright)':'rgba(243,236,216,0.4)'};font-weight:700;">
          ${auction.leadingTeamId ? '⬆ ' + (teams.find(t=>t.id===auction.leadingTeamId)?.name || '') : 'No bids yet — base price open'}
        </div>
        ${(auction.status==='bidding' && timerEnabled) ? `<div style="margin-top:14px;"><span class="display" id="bidTimerDisplay" style="font-size:32px;color:var(--gold-bright);"></span><div style="font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:rgba(243,236,216,0.4);">seconds left</div></div>` : ''}
      </div>
    `;
  }
  panel.appendChild(stage);

  // bidder controls
  if(me.role==='owner' && currentPlayer && auction.status==='bidding'){
    const myTeam = teams.find(t=>t.id===me.teamId);
    const isLeading = auction.leadingTeamId === me.teamId;
    const bidAmt = auction.currentBid ? nextCleanBid(auction.currentBid) : currentPlayer.base;
    const canAfford = myTeam && (myTeam.purse - myTeam.spent) >= bidAmt;
    const squadFull = squadCap && myTeam && (myTeam.roster||[]).length >= squadCap;
    const hasPassed = (auction.passed||[]).includes(me.teamId);
    const hasUsedWait = (auction.waitUsed||[]).includes(me.teamId);
    const inCooldown = bidCooldownEnabled && auction.bidCooldownUntil && Date.now() < auction.bidCooldownUntil;
    const maxAllowed = myTeam ? maxAllowedBid(myTeam) : Infinity;
    const reserveBreach = bidAmt > maxAllowed;

    const bidWrap = el('div',''); bidWrap.style.marginTop='18px'; bidWrap.style.display='flex'; bidWrap.style.gap='10px'; bidWrap.style.justifyContent='center'; bidWrap.style.flexWrap='wrap';
    const bidBtn = el('button','btn btn-green', isLeading ? `You're leading` : hasPassed ? `You passed` : `Bid ${fmtCr(bidAmt)}`);
    bidBtn.style.fontSize='16px'; bidBtn.style.padding='16px 26px';
    bidBtn.disabled = isLeading || !canAfford || !myTeam || squadFull || hasPassed || inCooldown || reserveBreach;
    bidBtn.onclick = async ()=>{
      const freshSnap = await db.ref('auctionState').once('value');
      if(freshSnap.exists()) auction = freshSnap.val();
      const freshPlayer = players.find(p=>p.id===auction.currentPlayerId);
      if(!freshPlayer || auction.status!=='bidding') return;
      if(bidCooldownEnabled && auction.bidCooldownUntil && Date.now() < auction.bidCooldownUntil) return;
      const amt = auction.currentBid ? nextCleanBid(auction.currentBid) : freshPlayer.base;
      if(myTeam && amt > maxAllowedBid(myTeam)){
        alert(`This bid would leave you unable to afford the players you still need. Max safe bid right now: ${fmtCr(maxAllowedBid(myTeam))}.`);
        return;
      }
      auction.bidHistory = auction.bidHistory || [];
      auction.bidHistory.push({ prevBid: auction.currentBid || 0, prevLeader: auction.leadingTeamId || null });
      auction.currentBid = amt;
      auction.leadingTeamId = me.teamId;
      auction.bidDeadline = Date.now() + (timerDuration*1000);
      if(bidCooldownEnabled) auction.bidCooldownUntil = Date.now() + (bidCooldownDuration*1000);
      auction.log = auction.log || [];
      auction.log.unshift({ type:'bid', team: myTeam.name, amount: amt, ts: Date.now() });
      await saveAuction();
      render();
    };
    // Fixed button order: Bid, Pass, Hold — always all three slots present
    // (Pass/Hold just hidden via visibility, not removed) so the row's
    // layout never shifts when cooldown/passed state changes.
    bidWrap.appendChild(bidBtn);

    const passBtn = el('button','btn btn-danger',"Pass");
    passBtn.style.fontSize='13px';
    if(isLeading || hasPassed){ passBtn.style.visibility='hidden'; }
    passBtn.onclick = async ()=>{
      const confirmed = confirm(`Pass on ${currentPlayer.name}? You won't be able to bid on this player again this round.`);
      if(!confirmed) return;
      const freshSnap = await db.ref('auctionState').once('value');
      if(freshSnap.exists()) auction = freshSnap.val();
      auction.passed = auction.passed || [];
      if(!auction.passed.includes(me.teamId)) auction.passed.push(me.teamId);
      auction.log = auction.log || [];
      auction.log.unshift({type:'pass', team: myTeam.name, ts:Date.now()});
      await saveAuction();
      render();
    };
    bidWrap.appendChild(passBtn);

    const waitBtn = el('button','btn btn-gold','Hold');
    waitBtn.style.fontSize='13px';
    waitBtn.disabled = hasUsedWait;
    if(isLeading || hasPassed){ waitBtn.style.visibility='hidden'; }
    waitBtn.onclick = async ()=>{
      const freshSnap = await db.ref('auctionState').once('value');
      if(freshSnap.exists()) auction = freshSnap.val();
      auction.waitUsed = auction.waitUsed || [];
      if(auction.waitUsed.includes(me.teamId)) return;
      auction.waitUsed.push(me.teamId);
      auction.bidDeadline = Date.now() + 5000;
      auction.log = auction.log || [];
      auction.log.unshift({type:'wait', team: myTeam.name, ts:Date.now()});
      await saveAuction();
      render();
    };
    bidWrap.appendChild(waitBtn);
    panel.appendChild(bidWrap);

    // Reserved-height status line below the buttons — always present (even
    // empty) so its content appearing/disappearing never nudges the buttons.
    const statusMsg = el('div',''); statusMsg.style.minHeight='18px'; statusMsg.style.marginTop='8px'; statusMsg.style.textAlign='center'; statusMsg.style.fontSize='12px';
    if(inCooldown){
      statusMsg.id = 'bidCooldownDisplay';
      statusMsg.style.color = 'rgba(243,236,216,0.6)';
    } else if(squadFull){
      statusMsg.style.color = 'var(--stamp-red)';
      statusMsg.textContent = `Squad full — cap of ${squadCap} players reached`;
    } else if(reserveBreach && !isLeading){
      statusMsg.style.color = 'var(--stamp-red)';
      statusMsg.textContent = `Reserve protected — max safe bid right now is ${fmtCr(maxAllowed)} (to stay able to afford remaining required players)`;
    } else if(!canAfford && !isLeading){
      statusMsg.style.color = 'var(--stamp-red)';
      statusMsg.textContent = 'Not enough purse remaining';
    }
    panel.appendChild(statusMsg);
  }

  // admin controls
  if(me.role==='admin'){
    const adminWrap = el('div',''); adminWrap.style.marginTop='20px'; adminWrap.style.borderTop='1px solid var(--line)'; adminWrap.style.paddingTop='18px';
    const rowTop = el('div',''); rowTop.style.display='flex'; rowTop.style.gap='10px'; rowTop.style.flexWrap='wrap'; rowTop.style.alignItems='center';

    if(auction.status !== 'bidding'){
      // Role filter — auctioneer picks a category (or All), the actual player is drawn at random
      const filterWrap = el('div',''); filterWrap.style.width='100%'; filterWrap.style.marginBottom='10px';
      filterWrap.appendChild(el('div','','<div style="font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:rgba(243,236,216,0.5);margin-bottom:6px;">Draw next player from</div>'));
      const filterBtns = el('div',''); filterBtns.style.display='flex'; filterBtns.style.gap='6px'; filterBtns.style.flexWrap='wrap';
      [['ALL','All Roles'],['BAT','Batters'],['BOWL','Bowlers'],['AR','All-Rounders'],['WK','Wicketkeepers']].forEach(([key,label])=>{
        const count = players.filter(p=>p.status==='pending' && (key==='ALL' || p.role===key)).length;
        const b = el('button', 'btn '+(pickerRoleFilter===key?'btn-gold':'btn-outline'), `${label} (${count})`);
        b.style.fontSize='12px'; b.style.padding='8px 12px';
        b.onclick = ()=>{ pickerRoleFilter = key; render(); };
        filterBtns.appendChild(b);
      });
      filterWrap.appendChild(filterBtns);
      rowTop.appendChild(filterWrap);

      const pool = players.filter(p=>p.status==='pending' && (pickerRoleFilter==='ALL' || p.role===pickerRoleFilter));

      // Begins a bidding round with the given player (shared by the random
      // draw and by the auctioneer manually choosing a player from the list).
      async function beginRound(chosen){
        if(actionInProgress || !chosen) return;
        actionInProgress = true;
        try{
          // re-check against the freshest player list right before starting,
          // in case another device just drew/finished a round for this category
          const freshSnap = await db.ref('players').once('value');
          const freshPlayers = toArray(freshSnap.exists() ? freshSnap.val() : []);
          const freshChosen = freshPlayers.find(p=>p.id===chosen.id && p.status==='pending');
          if(!freshChosen){ alert('That player is no longer available — try again.'); return; }
          players = freshPlayers;
          auction.currentPlayerId = freshChosen.id;
          auction.currentBid = 0;
          auction.leadingTeamId = null;
          auction.status = 'bidding';
          auction.bidHistory = [];
          auction.passed = [];
          auction.waitUsed = [];
          auction.bidCooldownUntil = null;
          auction.roundStartTs = Date.now();
          auction.bidDeadline = Date.now() + (timerDuration*1000);
          auction.commentary = generateCommentary(freshChosen);
          auction.log = auction.log || [];
          auction.log.unshift({type:'start', player:freshChosen.name, ts:Date.now()});
          await saveAuction();
          render();
        } finally {
          actionInProgress = false;
        }
      }

      const shuffleBtn = el('button','btn btn-gold', `🎲 Next Player →`);
      shuffleBtn.style.fontSize='14px'; shuffleBtn.style.padding='12px 18px';
      shuffleBtn.disabled = pool.length===0 || teams.length===0 || actionInProgress;
      shuffleBtn.onclick = async ()=>{
        if(actionInProgress || !pool.length) return;
        const freshSnap = await db.ref('players').once('value');
        const freshPlayers = toArray(freshSnap.exists() ? freshSnap.val() : []);
        const freshPool = freshPlayers.filter(p=>p.status==='pending' && (pickerRoleFilter==='ALL' || p.role===pickerRoleFilter));
        if(!freshPool.length){ alert('No pending players left in this category.'); return; }
        const chosen = freshPool[Math.floor(Math.random()*freshPool.length)];
        await beginRound(chosen);
      };
      // Selectable pending-player list — visible ONLY to the auctioneer, and
      // only when the "Next Player" button is set to "Choose from list".
      let pickWrap = null;
      let pickList = null;
      if(nextPlayerMode !== 'random'){
        pickWrap = el('div',''); pickWrap.style.width='100%'; pickWrap.style.marginTop='14px';
        pickList = el('div',''); pickList.style.maxHeight='260px'; pickList.style.overflowY='auto'; pickList.style.border='1px solid var(--line)'; pickList.style.borderRadius='10px';
        if(!pool.length){
          pickList.appendChild(el('div','','<div style="color:rgba(243,236,216,0.4);font-size:13px;padding:12px;">No pending players in this category.</div>'));
        } else {
          pool.forEach(p=>{
            const opt = el('div',''); opt.style.display='flex'; opt.style.justifyContent='space-between'; opt.style.alignItems='center'; opt.style.padding='9px 12px'; opt.style.borderBottom='1px solid var(--line)'; opt.style.cursor='pointer'; opt.style.fontSize='13px';
            opt.innerHTML = `<span><span class="${ROLE_COLORS[p.role]}" style="font-weight:700;">${ROLE_LABELS[p.role]}</span> · ${p.name}</span><span class="mono" style="color:var(--gold-bright);">${fmtCr(p.base)}</span>`;
            opt.onmouseover = ()=>{ opt.style.background='rgba(217,164,65,0.12)'; };
            opt.onmouseout = ()=>{ opt.style.background=''; };
            opt.onclick = ()=>{
              if(actionInProgress) return;
              if(!confirm(`Start the auction with ${p.name} (base ${fmtCr(p.base)})?`)) return;
              beginRound(p);
            };
            pickList.appendChild(opt);
          });
        }
        pickList.style.display = 'none';
        pickWrap.appendChild(pickList);
        rowTop.appendChild(pickWrap);
        shuffleBtn.onclick = ()=>{
          if(actionInProgress || !pool.length) return;
          pickList.style.display = pickList.style.display === 'none' ? 'block' : 'none';
          pickWrap.scrollIntoView({behavior:'smooth', block:'nearest'});
        };
      }
      rowTop.appendChild(shuffleBtn);
    } else {
      const soldBtn = el('button','btn btn-gold','🔨 SOLD');
      soldBtn.disabled = !auction.leadingTeamId || actionInProgress;
      soldBtn.onclick = async ()=>{
        if(actionInProgress) return;
        actionInProgress = true; soldBtn.disabled = true; soldBtn.textContent = 'Saving…';
        let ok = false;
        try{
          const freshSnap = await db.ref('auctionState').once('value');
          if(freshSnap.exists()) auction = freshSnap.val();
          const playerId = auction.currentPlayerId;
          const teamId = auction.leadingTeamId;
          const price = auction.currentBid;
          if(!playerId || !teamId){ alert('No active bid to close out.'); return; }
          const teamSnap = await db.ref('teams/'+teamId).once('value');
          const playerSnap = await db.ref('players/'+playerId).once('value');
          const p = playerSnap.exists() ? playerSnap.val() : null;
          const t = teamSnap.exists() ? teamSnap.val() : null;
          if(!p || !t){ alert('Could not find that player or team — try refreshing.'); return; }
          if(p.status !== 'pending'){ alert('This player was already processed.'); return; }

          const prevRoster = Array.isArray(t.roster) ? [...t.roster] : (t.roster ? Object.values(t.roster) : []);
          auction.lastAction = { type:'sold', playerId, teamId, price, prevTeamSpent:t.spent||0, prevRoster };

          await writePlayer(playerId, { status:'sold', soldTo:teamId, soldPrice:price });
          const newRoster = [...prevRoster, {playerId, price}];
          await writeTeam(teamId, { spent: (t.spent||0) + price, roster: newRoster });

          const localP = players.find(x=>x.id===playerId); if(localP){ localP.status='sold'; localP.soldTo=teamId; localP.soldPrice=price; }
          const localT = teams.find(x=>x.id===teamId); if(localT){ localT.spent=(t.spent||0)+price; localT.roster=newRoster; }
          auction.log = auction.log || [];
          auction.log.unshift({type:'sold', player:p.name, team:t.name, amount:price, ts:Date.now()});
          auction.status='idle'; auction.currentPlayerId=null; auction.currentBid=0; auction.leadingTeamId=null;
          auction.stampFlash = { type:'SOLD', player:p.name, team:t.name, amount:price, ts:Date.now() };
          await saveAuction();
          ok = true;
        } finally {
          actionInProgress = false;
          if(ok) render();
        }
      };
      const unsoldBtn = el('button','btn btn-navy','Mark Unsold');
      const roundAge = auction.roundStartTs ? (Date.now() - auction.roundStartTs) : 999999;
      const graceElapsed = unsoldGraceDuration <= 0 || roundAge >= (unsoldGraceDuration*1000);
      unsoldBtn.disabled = actionInProgress || !!auction.currentBid || !graceElapsed;
      if(!graceElapsed){ unsoldBtn.id = 'unsoldBtnGrace'; }
      unsoldBtn.onclick = async ()=>{
        if(actionInProgress) return;
        actionInProgress = true; unsoldBtn.disabled = true; unsoldBtn.textContent = 'Saving…';
        let ok = false;
        try{
          const freshSnap = await db.ref('auctionState').once('value');
          if(freshSnap.exists()) auction = freshSnap.val();
          if(auction.currentBid){ alert('A bid has already been placed — this player can no longer be marked unsold.'); return; }
          const playerId = auction.currentPlayerId;
          if(!playerId){ alert('No player currently on the block.'); return; }
          const playerSnap = await db.ref('players/'+playerId).once('value');
          const p = playerSnap.exists() ? playerSnap.val() : null;
          if(!p){ alert('Could not find that player — try refreshing.'); return; }
          if(p.status !== 'pending'){ alert('This player was already processed.'); return; }
          auction.lastAction = { type:'unsold', playerId };
          await writePlayer(playerId, { status:'unsold' });
          const localP = players.find(x=>x.id===playerId); if(localP) localP.status = 'unsold';
          auction.log = auction.log || [];
          auction.log.unshift({type:'unsold', player:p.name, ts:Date.now()});
          auction.status='idle'; auction.currentPlayerId=null; auction.currentBid=0; auction.leadingTeamId=null;
          auction.stampFlash = { type:'UNSOLD', player:p.name, ts:Date.now() };
          await saveAuction();
          ok = true;
        } finally {
          actionInProgress = false;
          if(ok) render();
        }
      };
      rowTop.appendChild(soldBtn); rowTop.appendChild(unsoldBtn);
    }

    const canUndoBid = auction.status==='bidding' && auction.bidHistory && auction.bidHistory.length;
    const undoBtn = el('button','btn btn-outline', canUndoBid ? '↺ Undo Last Bid' : '↺ Undo Last Sale');
    undoBtn.disabled = actionInProgress || (!canUndoBid && !auction.lastAction);
    undoBtn.onclick = async ()=>{
      if(actionInProgress) return;
      actionInProgress = true; undoBtn.disabled = true;
      let ok = false;
      try{
        const freshSnap = await db.ref('auctionState').once('value');
        if(freshSnap.exists()) auction = freshSnap.val();

        if(auction.status==='bidding' && auction.bidHistory && auction.bidHistory.length){
          const prev = auction.bidHistory.pop();
          auction.currentBid = prev.prevBid || 0;
          auction.leadingTeamId = prev.prevLeader || null;
          auction.log = auction.log || [];
          auction.log.unshift({type:'undo_bid', ts:Date.now()});
          await saveAuction();
          ok = true;
          return;
        }

        if(!auction.lastAction){ alert('Nothing to undo.'); return; }
        const la = auction.lastAction;
        if(la.type==='sold'){
          const p = players.find(x=>x.id===la.playerId);
          const t = teams.find(x=>x.id===la.teamId);
          // Firebase drops empty arrays on write/read — a team's very first
          // sale has prevRoster:[], which can come back as `undefined`.
          // Always default so we never send `undefined` into an update().
          const revertSpent = la.prevTeamSpent || 0;
          const revertRoster = la.prevRoster || [];
          await writePlayer(la.playerId, { status:'pending', soldTo:null, soldPrice:null });
          await writeTeam(la.teamId, { spent: revertSpent, roster: revertRoster });
          if(p){ p.status='pending'; delete p.soldTo; delete p.soldPrice; }
          if(t){ t.spent = revertSpent; t.roster = revertRoster; }
        } else if(la.type==='unsold'){
          const p = players.find(x=>x.id===la.playerId);
          await writePlayer(la.playerId, { status:'pending' });
          if(p) p.status='pending';
        }
        auction.lastAction = null;
        await saveAuction();
        ok = true;
      } finally {
        actionInProgress = false;
        if(ok) render();
      }
    };
    rowTop.appendChild(undoBtn);
    adminWrap.appendChild(rowTop);
    panel.appendChild(adminWrap);
  }
}

  // Bulk import from Excel/CSV
  const importWrap = el('div',''); importWrap.style.marginTop='14px'; importWrap.style.padding='12px'; importWrap.style.border='1px dashed var(--line)'; importWrap.style.borderRadius='10px';
  importWrap.innerHTML = `<div style="font-size:12px;color:rgba(243,236,216,0.6);margin-bottom:8px;">Bulk import players from Excel/CSV — columns: <span class="mono">Name</span>, <span class="mono">Role</span>, <span class="mono">Base</span>, and optionally <span class="mono">Matches</span>, <span class="mono">Runs</span>, <span class="mono">Strike Rate</span>, <span class="mono">Wkts</span>, <span class="mono">Econ</span>, <span class="mono">Catches</span>, <span class="mono">Team</span>, <span class="mono">Value</span> — column header wording is flexible. Fill in Team + Value for a row to auto-allocate that player to the team at that price (purse deducted, marked sold) instead of adding to the pending pool.</div>`;
  const fileInput = document.createElement('input'); fileInput.type='file'; fileInput.accept='.xlsx,.xls,.csv';
  fileInput.style.fontSize='12px'; fileInput.style.color='var(--cream)';
  const importStatus = el('div',''); importStatus.style.fontSize='12px'; importStatus.style.marginTop='8px'; importStatus.style.color='var(--gold-bright)';

  // Fuzzy header matcher: finds the actual column key for a given field, tolerant of
  // spacing/case/wording differences (e.g. "Base Price (Cr)", "base_price", "Strike Rate").
  function findKey(rowKeys, candidates){
    const norm = k => k.toLowerCase().replace(/[^a-z0-9]/g,'');
    const normKeys = rowKeys.map(k => ({ raw:k, norm: norm(k) }));
    for(const cand of candidates){
      const c = norm(cand);
      const exact = normKeys.find(k => k.norm === c);
      if(exact) return exact.raw;
    }
    for(const cand of candidates){
      const c = norm(cand);
      const partial = normKeys.find(k => k.norm.includes(c));
      if(partial) return partial.raw;
    }
    return null;
  }
  function parseNum(v){
    if(v === undefined || v === null || v === '') return 0;
    const cleaned = String(v).replace(/[^0-9.\-]/g,'');
    const n = parseFloat(cleaned);
    return isNaN(n) ? 0 : n;
  }
  function normalizeRole(raw){
    const r = String(raw||'').toUpperCase();
    if(r.includes('BOWL')) return 'BOWL';
    if(r.includes('ALL') || r === 'AR') return 'AR';
    if(r.includes('WK') || r.includes('KEEP')) return 'WK';
    return 'BAT';
  }

  fileInput.onchange = async (e)=>{
    const file = e.target.files[0]; if(!file) return;
    importStatus.textContent = 'Reading file…';
    try{
      const data = await file.arrayBuffer();
      const wb = XLSX.read(data, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
      let added = 0, skipped = 0, allocated = 0, unmatchedTeam = 0;
      rows.forEach(r=>{
        const keys = Object.keys(r);
        const nameKey = findKey(keys, ['name','player','playername']);
        const roleKey = findKey(keys, ['role','position','category','type']);
        const baseKey = findKey(keys, ['base','baseprice','price','basepricecr']);
        const matchesKey = findKey(keys, ['matches','mat']);
        const runsKey = findKey(keys, ['runs']);
        const srKey = findKey(keys, ['strikerate','sr']);
        const wktsKey = findKey(keys, ['wkts','wickets']);
        const econKey = findKey(keys, ['econ','economy']);
        const catchesKey = findKey(keys, ['catches','ct']);
        const teamKey = findKey(keys, ['team','allocatedteam','soldto','teamname']);
        const valueKey = findKey(keys, ['value','soldprice','soldamount','soldvalue','amount']);

        const nameVal = nameKey ? r[nameKey] : '';
        if(!nameVal || !String(nameVal).trim()){ skipped++; return; }

        const newPlayer = {
          id: uid(),
          name: String(nameVal).trim(),
          role: normalizeRole(roleKey ? r[roleKey] : 'BAT'),
          base: baseKey ? (parseNum(r[baseKey]) || 0.5) : 0.5,
          status:'pending',
          matches: matchesKey ? parseNum(r[matchesKey]) : 0,
          runs: runsKey ? parseNum(r[runsKey]) : 0,
          strikeRate: srKey ? parseNum(r[srKey]) : 0,
          wkts: wktsKey ? parseNum(r[wktsKey]) : 0,
          econ: econKey ? parseNum(r[econKey]) : 0,
          catches: catchesKey ? parseNum(r[catchesKey]) : 0
        };

        // Optional Team + Value → auto-allocate this player immediately
        const teamNameRaw = teamKey ? String(r[teamKey]||'').trim() : '';
        const valueRaw = valueKey ? r[valueKey] : '';
        if(teamNameRaw && valueRaw !== '' && valueRaw !== undefined && valueRaw !== null){
          const matchedTeam = teams.find(t => t.name.toLowerCase().trim() === teamNameRaw.toLowerCase());
          const price = parseNum(valueRaw);
          if(matchedTeam && price > 0){
            newPlayer.status = 'sold';
            newPlayer.soldTo = matchedTeam.id;
            newPlayer.soldPrice = price;
            matchedTeam.spent = (matchedTeam.spent||0) + price;
            matchedTeam.roster = [...(matchedTeam.roster||[]), { playerId: newPlayer.id, price }];
            allocated++;
          } else if(!matchedTeam){
            unmatchedTeam++;
          }
        }

        players.push(newPlayer);
        added++;
      });
      await savePlayers();
      await saveTeams();
      importStatus.style.color = 'var(--gold-bright)';
      let summary = `Imported ${added} player(s)`;
      if(allocated) summary += `, ${allocated} auto-allocated to teams`;
      if(unmatchedTeam) summary += `, ${unmatchedTeam} had a team name that didn't match any existing team (added as pending instead)`;
      if(skipped) summary += `, skipped ${skipped} row(s) without a name`;
      importStatus.textContent = summary + '.';
      fileInput.value = '';
      render();
    }catch(err){
      importStatus.style.color = 'var(--stamp-red)';
      importStatus.textContent = 'Could not read that file — make sure it\'s a valid .xlsx/.xls/.csv with a header row.';
    }
  };
  importWrap.appendChild(fileInput);
  importWrap.appendChild(importStatus);
  panel.appendChild(importWrap);

  const poolWrap = el('div',''); poolWrap.style.marginTop='12px'; poolWrap.style.maxHeight='320px'; poolWrap.style.overflowY='auto';
  ['pending','sold','unsold'].forEach(status=>{
    const group = players.filter(p=>p.status===status);
    if(!group.length) return;
    const groupHeader = el('div',''); groupHeader.style.display='flex'; groupHeader.style.justifyContent='space-between'; groupHeader.style.alignItems='center'; groupHeader.style.margin='10px 0 4px';
    groupHeader.appendChild(el('div','',`<div style="font-size:11px;text-transform:uppercase;color:rgba(243,236,216,0.4);">${status} (${group.length})</div>`));
    if(status==='unsold'){
      const requeueAll = el('a','link','↺ Re-queue all'); requeueAll.style.fontSize='11px';
      requeueAll.onclick = async ()=>{
        await Promise.all(group.map(p => writePlayer(p.id, { status:'pending' })));
        group.forEach(p=>{ p.status='pending'; });
        render();
      };
      groupHeader.appendChild(requeueAll);
    }
    poolWrap.appendChild(groupHeader);
    group.forEach(p=>{
      const rowWrap = el('div',''); rowWrap.style.padding='7px 0'; rowWrap.style.borderBottom='1px solid var(--line)';
      const row = el('div',''); row.style.display='flex'; row.style.justifyContent='space-between'; row.style.fontSize='13px';
      row.innerHTML = `<span><span class="${ROLE_COLORS[p.role]}" style="font-weight:700;">${ROLE_LABELS[p.role]}</span> · ${p.name}</span><span class="mono">${status==='sold'?fmtCr(p.soldPrice):fmtCr(p.base)}</span>`;
      if(status==='pending'){
        const rm = document.createElement('span'); rm.textContent='✕'; rm.style.cursor='pointer'; rm.style.color='var(--stamp-red)'; rm.style.marginLeft='10px';
        rm.onclick = async ()=>{ if(!(await confirmDeletePin('remove this player'))) return; players = players.filter(x=>x.id!==p.id); await savePlayers(); render(); };
        row.querySelector('span').appendChild(rm);
      }
      if(status==='unsold'){
        const rq = document.createElement('span'); rq.textContent=' ↺ Re-queue'; rq.style.cursor='pointer'; rq.style.color='var(--gold-bright)'; rq.style.marginLeft='10px'; rq.style.fontSize='11px';
        rq.onclick = async ()=>{ await writePlayer(p.id, { status:'pending' }); p.status='pending'; render(); };
        row.querySelector('span').appendChild(rq);
        const alloc = document.createElement('span'); alloc.textContent=' ▸ Give to team'; alloc.style.cursor='pointer'; alloc.style.color='var(--gold-bright)'; alloc.style.marginLeft='10px'; alloc.style.fontSize='11px';
        alloc.title = `Allocate ${p.name} to a team at your chosen price`;
        alloc.onclick = ()=>{
          if(!teams.length){ alert('No teams available — add one in Setup first.'); return; }
          const picked = prompt(`Allocate "${p.name}" to which team?`, teams[0].name);
          if(picked == null || !picked.trim()) return;
          const target = teams.find(t=>t.name.toLowerCase().trim()===picked.toLowerCase().trim());
          if(!target){ alert(`No team named "${picked}". Available: ${teams.map(t=>t.name).join(', ')}`); return; }
          const priceRaw = prompt(`Price for ${p.name} in ₹ Cr (blank = base price ${fmtCr(p.base||0)}):`, p.base);
          if(priceRaw == null) return;
          const price = priceRaw.trim()==='' ? p.base : parseFloat(priceRaw.trim());
          if(isNaN(price) || price <= 0){ alert('Please enter a valid price greater than 0.'); return; }
          if(!confirm(`Allocate ${p.name} to ${target.name} at ${fmtCr(price)}? This deducts the amount from their purse.`)) return;
          allocateUnsold(p.id, target.id, price).then(()=>render()).catch(err=>alert('Could not allocate: ' + (err.message||err)));
        };
        row.querySelector('span').appendChild(alloc);
      }
      if(status==='sold'){
        const teamName = (teams.find(t=>t.id===p.soldTo)||{}).name || '';
        const rv = document.createElement('span'); rv.textContent=' ↺ Mark Unsold'; rv.style.cursor='pointer'; rv.style.color='var(--stamp-red)'; rv.style.marginLeft='10px'; rv.style.fontSize='11px';
        rv.title = `Resets ${p.name} to base price and returns ${fmtCr(p.soldPrice||p.base||0)} to ${teamName}`;
        rv.onclick = ()=>{ if(!confirm(`Mark ${p.name} as unsold? This resets them to base price and returns ${fmtCr(p.soldPrice||p.base||0)} to ${teamName}.`)) return; markSoldAsUnsold(p.id).then(()=>render()).catch(err=>alert('Could not complete: ' + (err.message||err))); };
        row.querySelector('span').appendChild(rv);
      }
      rowWrap.appendChild(row);
      const stats = statsStripHTML(p);
      if(stats) rowWrap.insertAdjacentHTML('beforeend', stats.replace('margin-top:10px','margin-top:3px'));
      poolWrap.appendChild(rowWrap);
    });
  });
  panel.appendChild(poolWrap);

  // danger zone
  const reset = el('button','btn btn-outline','Reset Entire Auction'); reset.style.marginTop='18px'; reset.style.borderColor='var(--stamp-red)'; reset.style.color='var(--stamp-red)';
  reset.onclick = async ()=>{
    if(!confirm('This clears all teams, players and auction state. Continue?')) return;
    if(!(await confirmDeletePin('reset the entire auction'))) return;
    teams=[]; players=[]; auction={currentPlayerId:null,currentBid:0,leadingTeamId:null,status:'idle',log:[],lastAction:null,bidHistory:[],passed:[],waitUsed:[]};
    await saveTeams(); await savePlayers(); await saveAuction(); render();
  };
  panel.appendChild(reset);
}

// ---------- TEAMS TAB ----------
// Generates and downloads an .xlsx report of players sold to each team,
// callable at any point during the auction. Includes a per-player sheet and
// a team-summary sheet (purse spent/remaining, player counts).
function downloadSquadReport(teamsList){
  const rosterRows = [];
  teamsList.forEach(t=>{
    const roster = t.roster || [];
    if(!roster.length){
      rosterRows.push({ Team: t.name, Player: '(no players bought yet)', Role:'', 'Price (Cr)':'', Matches:'', Runs:'', 'Strike Rate':'', Wkts:'', Econ:'', Catches:'' });
      return;
    }
    roster.forEach(r=>{
      const p = players.find(x=>x.id===r.playerId);
      rosterRows.push({
        Team: t.name,
        Player: p ? p.name : '(unknown player)',
        Role: p ? (ROLE_LABELS[p.role]||p.role) : '',
        'Price (Cr)': r.price,
        Matches: p ? (p.matches||'') : '',
        Runs: p ? (p.runs||'') : '',
        'Strike Rate': p ? (p.strikeRate||'') : '',
        Wkts: p ? (p.wkts||'') : '',
        Econ: p ? (p.econ||'') : '',
        Catches: p ? (p.catches||'') : ''
      });
    });
  });

  const summaryRows = teamsList.map(t=>({
    Team: t.name,
    'Purse (Cr)': t.purse,
    'Spent (Cr)': t.spent||0,
    'Remaining (Cr)': (t.purse||0) - (t.spent||0),
    'Players Bought': (t.roster||[]).length
  }));

  const wb = XLSX.utils.book_new();
  const summarySheet = XLSX.utils.json_to_sheet(summaryRows);
  const rosterSheet = XLSX.utils.json_to_sheet(rosterRows);
  XLSX.utils.book_append_sheet(wb, rosterSheet, 'Players Sold');
  XLSX.utils.book_append_sheet(wb, summarySheet, 'Team Summary');

  const stamp = new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
  XLSX.writeFile(wb, `LA_Black_Squad_Auction_Report_${stamp}.xlsx`);
}

// Generates and downloads a single team's squad detail as its own .xlsx file —
// a "Players Sold" sheet (role, price) plus a summary row (purse / spent /
// remaining balance / player count).
function downloadTeamSquadReport(team){
  const roster = team.roster || [];
  const rosterRows = roster.map(r=>{
    const p = players.find(x=>x.id===r.playerId);
    return {
      Player: p ? p.name : '(unknown player)',
      Role: p ? (ROLE_LABELS[p.role]||p.role) : '',
      'Price (Cr)': r.price,
      Matches: p ? (p.matches||'') : '',
      Runs: p ? (p.runs||'') : '',
      'Strike Rate': p ? (p.strikeRate||'') : '',
      Wkts: p ? (p.wkts||'') : '',
      Econ: p ? (p.econ||'') : '',
      Catches: p ? (p.catches||'') : ''
    };
  });
  if(!rosterRows.length) rosterRows.push({ Player:'(no players bought yet)', Role:'', 'Price (Cr)':'', Matches:'', Runs:'', 'Strike Rate':'', Wkts:'', Econ:'', Catches:'' });

  const summaryRow = [{
    Team: team.name,
    'Purse (Cr)': team.purse,
    'Spent (Cr)': team.spent||0,
    'Remaining (Cr)': (team.purse||0) - (team.spent||0),
    'Players Bought': roster.length
  }];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rosterRows), 'Players Sold');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summaryRow), 'Team Summary');

  const stamp = new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
  const safeName = (team.name||'Team').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'_');
  XLSX.writeFile(wb, `${safeName}_Squad_Report_${stamp}.xlsx`);
}

function renderTeamsPanel(panel){
  const visibleTeams = me.role==='owner' ? teams.filter(t=>t.id===me.teamId) : teams;
  const headerRow = el('div',''); headerRow.style.display='flex'; headerRow.style.justifyContent='space-between'; headerRow.style.alignItems='center'; headerRow.style.flexWrap='wrap'; headerRow.style.gap='10px';
  headerRow.appendChild(el('div','display',`<span style="font-size:20px;color:var(--gold-bright);">${me.role==='owner' ? 'My Squad' : 'Teams &amp; Squads'}</span>`));
  if(me.role==='admin'){
    const downloadWrap = el('div',''); downloadWrap.style.textAlign='right';
    const downloadBtn = el('button','btn btn-outline','⬇ Download Squad Report');
    downloadBtn.style.fontSize='12px';
    downloadBtn.onclick = ()=> downloadSquadReport(visibleTeams);
    downloadWrap.appendChild(downloadBtn);
    downloadWrap.appendChild(el('div','','<div style="font-size:10px;color:rgba(243,236,216,0.4);margin-top:4px;">Excel file has 2 tabs: "Players Sold" and "Team Summary"</div>'));
    headerRow.appendChild(downloadWrap);
  } else if(me.role==='owner' && visibleTeams.length){
    const myTeam = visibleTeams[0];
    const downloadBtn = el('button','btn btn-outline','⬇ Download My Squad');
    downloadBtn.style.fontSize='12px';
    downloadBtn.onclick = ()=> downloadTeamSquadReport(myTeam);
    headerRow.appendChild(downloadBtn);
  }
  panel.appendChild(headerRow);
  if(!visibleTeams.length){ panel.appendChild(el('div','','<div style="color:rgba(243,236,216,0.5);margin-top:10px;">No teams yet.</div>')); return; }
  const grid = el('div',''); grid.style.display='grid'; grid.style.gridTemplateColumns='repeat(auto-fill,minmax(260px,1fr))'; grid.style.gap='14px'; grid.style.marginTop='16px';
  visibleTeams.forEach(t=>{
    const c = el('div','card');
    c.innerHTML = `<div style="font-weight:800;font-size:16px;${t.id===me.teamId?'color:var(--gold-bright);':''}">${t.name}</div>
      <div class="mono" style="font-size:13px;margin:4px 0 10px;color:rgba(243,236,216,0.6);">Purse left: ${fmtCr(t.purse-t.spent)} / ${fmtCr(t.purse)}</div>`;
    if(!(t.roster||[]).length){
      c.innerHTML += `<div style="font-size:12px;color:rgba(243,236,216,0.4);">No players bought yet</div>`;
    } else {
      t.roster.forEach(r=>{
        const p = players.find(x=>x.id===r.playerId);
        if(!p) return;
        c.innerHTML += `<div style="padding:6px 0;border-bottom:1px solid var(--line);">
          <div style="display:flex;justify-content:space-between;font-size:12px;">
            <span><span class="${ROLE_COLORS[p.role]}">${ROLE_LABELS[p.role]}</span> · ${p.name}</span>
            <span style="display:flex;align-items:center;gap:8px;"><span class="mono">${fmtCr(r.price)}</span>${me.role==='admin'
              ? `<span class="link" data-revoke-sold="${r.playerId}" style="font-size:10px;color:var(--stamp-red);">↺ Unsold</span>` : ''}</span>
          </div>
          ${statsStripHTML(p) ? `<div style="margin-top:2px;">${statsStripHTML(p)}</div>` : ''}
        </div>`;
      });
      if(me.role==='admin'){
        c.querySelectorAll('[data-revoke-sold]').forEach(elv=>{
          const pid = elv.getAttribute('data-revoke-sold');
          elv.onclick = ()=>{
            const pp = players.find(x=>x.id===pid);
            const tt = teams.find(x=>x.id===pp.soldTo);
            const amt = fmtCr(pp.soldPrice||pp.base||0);
            if(!confirm(`Mark ${pp.name} as unsold? This resets them to base price and returns ${amt} to ${tt?tt.name:''}.`)) return;
            markSoldAsUnsold(pid).then(()=>render()).catch(err=>alert('Could not complete: ' + (err.message||err)));
          };
        });
      }
    }
    if(me.role==='admin'){
      const teamDownload = el('button','btn btn-outline','⬇ Download Squad');
      teamDownload.style.fontSize='11px'; teamDownload.style.padding='7px 12px'; teamDownload.style.marginTop='10px'; teamDownload.style.width='100%';
      teamDownload.onclick = ()=>{
        try{ downloadTeamSquadReport(t); }
        catch(err){ alert('Could not download: ' + (err && err.message ? err.message : err)); }
      };
      c.appendChild(teamDownload);
    }
    grid.appendChild(c);
  });
  panel.appendChild(grid);
}

// Restore a previous session (if any) so refresh/back-button doesn't log
// the person out. We optimistically show the app screen right away, then
// double-check the owner's team still exists once fresh data arrives.
const restoredSession = loadSession();
if(restoredSession && restoredSession.role){
  if(restoredSession.role === 'owner'){ location.replace('owner.html'); }
  if(restoredSession.role === 'spectator'){ location.replace('spectator.html'); }
  me = restoredSession;
  screen = 'app';
}

loadAll();
attachRealtimeListeners();

if(restoredSession && restoredSession.role === 'owner'){
  setTimeout(()=>{
    const stillExists = teams.some(t => t.id === restoredSession.teamId);
    if(!stillExists){
      clearSession();
      me = { name:'', role:null, teamId:null };
      screen = 'login';
      render();
    }
  }, 1500);
}
</script>
