# Cloudflare deployment configuration for the LA Black Squad auction app.
#
# This is a MULTI-PAGE static site: every page is its own .html file at the
# root (index.html = login, admin.html, owner.html, spectator.html). They
# link/redirect to each other by filename, so all files live in this same
# root folder.
#
# This config makes `npx wrangler deploy` publish the folder as STATIC
# ASSETS (served by a Worker using its built-in [assets] handler) rather
# than running a hello-world worker function. JSON/html assets are served
# directly; unknown paths get a real 404 (multi-page app, no SPA fallback).

# MUST match the project name your Cloudflare CI expects (the build log
# showed: CI system expected "auction").
name = "auction"

# Required by Worker Builds when publishing.
compatibility_date = "2026-09-01"

# Serve the static files in this directory (the project root).
[assets]
directory = "./"
not_found_handling = "404-page"

[env.production]
name = "auction"
compatibility_date = "2026-09-01"
